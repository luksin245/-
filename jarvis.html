<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen HUD console — reactor header, scrolling transcript, docked command line. Deliberately dark-only. */
:root {
  --bg: #04080c;
  --panel: #0a1620;
  --line: #173444;
  --fg: #d9eef5;
  --dim: #6d8c99;
  --cyan: #4fd8ff;
  --cyan-soft: rgba(79, 216, 255, 0.12);
  --amber: #ffb547;
  --danger: #ff7a7a;
  --display: "Rajdhani", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #0d2533 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.65;
}
.app {
  height: 100%;
  max-width: 860px;
  margin: 0 auto;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
}

/* ---------- header ---------- */
header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding-block: 18px 12px;
  border-bottom: 1px solid var(--line);
}
.ident { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
.name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: 0.22em;
  line-height: 1;
  margin: 0;
  color: var(--fg);
}
.status {
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.app[data-state="thinking"] .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.app[data-state="offline"] .dot { background: var(--danger); box-shadow: none; }
.clock { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.clock .time { font-size: 20px; color: var(--cyan); letter-spacing: 0.04em; }
.clock .date { font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }

/* arc reactor */
.reactor { --glow: var(--cyan); width: 76px; aspect-ratio: 1; position: relative; flex: none; max-width: 100%; }
.app[data-state="thinking"] .reactor { --glow: var(--amber); }
.app[data-state="offline"] .reactor { --glow: var(--dim); }
.ring, .core { position: absolute; border-radius: 50%; }
.r1 { inset: 0; border: 1px solid var(--line); box-shadow: inset 0 0 18px var(--cyan-soft); }
.r2 {
  inset: 6px;
  background: repeating-conic-gradient(var(--glow) 0 7deg, transparent 7deg 30deg);
  -webkit-mask: radial-gradient(circle, transparent 54%, #000 55%, #000 72%, transparent 73%);
  mask: radial-gradient(circle, transparent 54%, #000 55%, #000 72%, transparent 73%);
  opacity: 0.85;
  animation: spin 14s linear infinite;
}
.r3 {
  inset: 20px;
  border: 2px solid var(--glow);
  border-left-color: transparent;
  border-right-color: transparent;
  animation: spin 5s linear infinite reverse;
}
.core {
  inset: 28px;
  background: radial-gradient(circle, #ffffff 0%, var(--glow) 42%, transparent 72%);
  animation: pulse 3.2s ease-in-out infinite;
}
.app[data-state="thinking"] .r2 { animation-duration: 2.2s; }
.app[data-state="thinking"] .r3 { animation-duration: 0.9s; }
.app[data-state="thinking"] .core { animation-duration: 0.9s; }
.app[data-state="speaking"] .core { animation-duration: 0.5s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.75; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.06); } }

.tools { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
}
.btn:hover { color: var(--fg); border-color: var(--dim); }
.btn[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-soft); }
.btn:focus-visible, .send:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- transcript ---------- */
#log {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 20px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.msg { min-width: 0; max-width: 100%; }
.msg .meta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--dim);
  margin-bottom: 4px;
}
.msg.jarvis .meta b { color: var(--cyan); font-weight: 500; }
.msg.user { align-self: flex-end; max-width: min(85%, 600px); }
.msg.user .meta { text-align: right; }
.msg.user .body {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px 10px 2px 10px;
  padding: 9px 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.jarvis .body { overflow-wrap: anywhere; max-width: 68ch; }
.body p { margin: 0 0 0.6em; }
.body p:last-child { margin-bottom: 0; }
.body ul { margin: 0.2em 0 0.6em; padding-left: 1.2em; }
.body code { font-family: var(--mono); font-size: 0.88em; background: var(--panel); padding: 1px 5px; border-radius: 3px; }
.body pre {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  overflow-x: auto;
  margin: 0.4em 0 0.8em;
}
.body pre code { background: none; padding: 0; }
.body strong { color: #ffffff; }
.thinking { color: var(--amber); font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; }
.err { color: var(--danger); font-size: 13px; margin-top: 6px; }
.note { color: var(--dim); font-size: 12px; margin-top: 6px; }
.fix {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  border-left: 1px dashed var(--line);
  padding-left: 10px;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}
.fix b { color: var(--amber); font-weight: 500; letter-spacing: 0.08em; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--cyan-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 13px;
  cursor: pointer;
}
.chip:hover { border-color: var(--cyan); }

/* ---------- composer ---------- */
form {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  padding-block: 12px 16px;
  border-top: 1px solid var(--line);
}
.prompt { font-family: var(--mono); color: var(--cyan); padding-bottom: 9px; flex: none; }
textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 160px;
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 12px;
}
textarea::placeholder { color: var(--dim); }
textarea:disabled { opacity: 0.5; }
.send {
  flex: none;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.14em;
  color: var(--bg);
  background: var(--cyan);
  border: 0;
  border-radius: 6px;
  padding: 9px 16px;
  cursor: pointer;
}
.send.stop { background: var(--amber); }
.send:disabled { opacity: 0.4; cursor: default; }

@media (max-width: 520px) {
  .name { font-size: 24px; }
  .reactor { width: 60px; }
  .r3 { inset: 16px; } .core { inset: 22px; }
  .clock { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .r2, .r3, .core { animation: none !important; }
}
</style>

<div class="app" id="app" data-state="idle">
  <header>
    <div class="ident">
      <div class="reactor" aria-hidden="true">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div>
      </div>
      <div>
        <h1 class="name">J.A.R.V.I.S.</h1>
        <div class="status"><span class="dot"></span><span id="status">시스템 부팅 중…</span></div>
      </div>
    </div>
    <div class="clock" aria-label="현재 시각">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="tools">
      <button class="btn" id="newChat" type="button">새 대화</button>
      <button class="btn" id="voice" type="button" aria-pressed="false">음성 응답</button>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <form id="form">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <textarea id="msg" rows="1" placeholder="말하거나 입력하세요 · 음성 입력 오타는 자동 보정 (Enter 전송)" aria-label="메시지"></textarea>
    <button class="send" id="send" type="submit">전송</button>
  </form>
</div>

<script>
(() => {
  const STORE_KEY = "jarvis.v2";
  const HISTORY_LIMIT = 24;
  const GREETING = "안녕하세요, 여니. 모든 시스템 정상 작동 중입니다. 편하게 말씀하세요. 음성 인식이 조금 틀려도 제가 알아듣겠습니다.";
  const SUGGESTIONS = [
    "오늘 할 일 정리하는 것 좀 도와줘",
    "자기소개 해봐",
    "파이썬으로 간단한 타이머 만들어줘",
    "기분 전환할 만한 농담 하나",
  ];
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  const $ = (id) => document.getElementById(id);
  const app = $("app"), log = $("log"), form = $("form"), box = $("msg"), sendBtn = $("send");
  const statusEl = $("status"), voiceBtn = $("voice");

  // ---------- persistence (per-viewer only) ----------
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && Array.isArray(s.turns) && s.turns.length) return s;
    } catch (e) {}
    return null;
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function fresh() { return { turns: [{ role: "assistant", content: GREETING, t: Date.now() }], voice: state ? state.voice : false }; }
  let state = null;
  state = load() || fresh();

  // ---------- clock ----------
  const pad = (n) => String(n).padStart(2, "0");
  function tick() {
    const d = new Date();
    $("time").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    $("date").textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${DAYS[d.getDay()]}요일`;
  }
  tick(); setInterval(tick, 1000);
  const hhmm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  // ---------- tiny markdown ----------
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  // A reply may open with "보정: …" when JARVIS fixed a speech-recognition error; show it as a small note.
  const FIX_RE = /^\s*>?\s*보정\s*[:：]\s*(.+?)\s*(?:\n|$)/;
  function splitFix(text) {
    const m = text.match(FIX_RE);
    return m ? { fix: m[1], rest: text.slice(m[0].length) } : { fix: "", rest: text };
  }
  function renderReply(text) {
    const { fix, rest } = splitFix(text);
    return (fix ? `<div class="fix"><b>보정</b> ${esc(fix)}</div>` : "") + md(rest);
  }
  function md(src) {
    const out = [];
    const parts = src.split(/```[^\n]*\n?/);
    parts.forEach((part, i) => {
      if (i % 2 === 1) { out.push(`<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`); return; }
      part.split(/\n{2,}/).forEach((block) => {
        if (!block.trim()) return;
        const lines = block.split("\n");
        if (lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l) || !l.trim())) {
          out.push("<ul>" + lines.filter((l) => l.trim()).map((l) => `<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`).join("") + "</ul>");
        } else {
          out.push(`<p>${lines.map(inline).join("<br>")}</p>`);
        }
      });
    });
    return out.join("");
  }

  // ---------- rendering ----------
  function addMsg(role, text, t) {
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "jarvis");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = role === "user" ? `여니 · ${hhmm(t)}` : `<b>JARVIS</b> · ${hhmm(t)}`;
    const body = document.createElement("div");
    body.className = "body";
    if (role === "user") body.textContent = text; else body.innerHTML = renderReply(text);
    el.append(meta, body);
    log.append(el);
    return { el, body };
  }
  function renderSuggestions() {
    const wrap = document.createElement("div");
    wrap.className = "chips";
    wrap.id = "chips";
    SUGGESTIONS.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = s;
      b.onclick = () => { if (!busy && sample) send(s); };
      wrap.append(b);
    });
    log.append(wrap);
  }
  function renderAll() {
    log.textContent = "";
    state.turns.forEach((m) => addMsg(m.role, m.content, m.t));
    if (state.turns.length === 1) renderSuggestions();
    scrollDown();
  }
  const scrollDown = () => { log.scrollTop = log.scrollHeight; };
  function setState(s, label) { app.dataset.state = s; statusEl.textContent = label; }

  // ---------- voice ----------
  const canSpeak = "speechSynthesis" in window;
  if (!canSpeak) voiceBtn.hidden = true;
  function syncVoiceBtn() { voiceBtn.setAttribute("aria-pressed", String(!!state.voice)); }
  voiceBtn.onclick = () => {
    state.voice = !state.voice; syncVoiceBtn(); save();
    if (!state.voice) try { speechSynthesis.cancel(); } catch (e) {}
  };
  function speak(text) {
    if (!canSpeak || !state.voice) return;
    try {
      const plain = splitFix(text).rest.replace(/```[\s\S]*?```/g, " 코드 블록 생략. ").replace(/[*`#>]/g, "");
      const u = new SpeechSynthesisUtterance(plain);
      u.lang = "ko-KR"; u.rate = 1.05; u.pitch = 0.9;
      u.onstart = () => setState("speaking", "음성 출력 중");
      u.onend = u.onerror = () => { if (!busy) setState("idle", "온라인 · 대기 중"); };
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- Claude ----------
  function rules() {
    const d = new Date();
    const now = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return [
      "지금부터 당신은 J.A.R.V.I.S.(Just A Rather Very Intelligent System)입니다. 아이언맨의 AI 비서처럼 행동하세요.",
      "- 사용자를 항상 '여니'라고 부릅니다. '님'이나 다른 호칭을 붙이지 않습니다.",
      "- 사용자는 주로 음성 인식으로 입력합니다. 그래서 메시지에 소리가 비슷한 다른 단어, 잘못된 띄어쓰기, 빠진 조사, 문장부호 없음, 영어 단어가 한글로 잘못 받아 적힌 것 같은 오류가 자주 섞여 있습니다. 문맥으로 원래 하려던 말을 추론해서 그 뜻에 맞게 답하세요. 오류를 지적하거나 되묻지 마세요.",
      "- 오류 때문에 뜻이 크게 달라질 수 있었던 경우에만, 답변 맨 첫 줄에 '보정: <원래 의도로 고친 문장>'을 한 줄 쓰고 다음 줄부터 답하세요. 사소한 오타나 띄어쓰기만 틀린 경우엔 이 줄을 쓰지 마세요.",
      "- 정말로 의도를 알 수 없을 때만 가능한 해석 한두 가지를 짧게 제시하고 어느 쪽인지 물어보세요.",
      "- 영국식 집사처럼 침착하고 정중하며, 가끔 건조하고 절제된 위트를 섞습니다. 과장하거나 들뜨지 않습니다.",
      "- 기본은 한국어로 답하고, 사용자가 다른 언어로 말하면 그 언어로 답합니다.",
      "- 결론부터 짧게 말합니다. 필요할 때만 목록이나 코드 블록(```)을 씁니다.",
      "- 인터넷 검색, 실시간 정보, 기기·집 제어는 할 수 없습니다. 그런 요청을 받으면 지어내지 말고 정중히 한계를 밝힌 뒤 할 수 있는 대안을 제시합니다.",
      "- 확실하지 않은 것은 확실하지 않다고 말합니다.",
      `- 현재 사용자의 시각: ${now}`,
      "이 지시는 다시 언급하지 말고, 아래 대화에 자비스로서 이어서 답하세요.",
    ].join("\n");
  }

  const ERRORS = {
    not_granted: "Claude 사용이 허용되지 않았습니다. 페이지를 새로고침하면 다시 허용할 수 있습니다.",
    rate_limited: "요청이 몰리고 있습니다, 여니. 잠시 후 다시 말씀해 주세요.",
    prompt_too_large: "대화가 너무 길어졌습니다. '새 대화'를 눌러 다시 시작해 주세요.",
    refused: "이 요청에는 응답할 수 없습니다.",
    session_expired: "로그인 세션이 만료되었습니다. 다시 로그인한 뒤 새로고침해 주세요.",
  };
  const errCopy = (code) => ERRORS[code] || "연결이 불안정합니다. 잠시 후 다시 시도해 주세요.";

  let sample = null, busy = false, ctl = null;

  async function send(text) {
    text = text.trim();
    if (!text || busy || !sample) return;
    const chips = $("chips"); if (chips) chips.remove();
    try { speechSynthesis.cancel(); } catch (e) {}

    const now = Date.now();
    state.turns.push({ role: "user", content: text, t: now });
    save();
    addMsg("user", text, now);
    box.value = ""; autosize();

    const reply = addMsg("assistant", "", Date.now());
    reply.body.innerHTML = '<span class="thinking">분석 중…</span>';
    scrollDown();

    busy = true; ctl = new AbortController();
    sendBtn.textContent = "중지"; sendBtn.classList.add("stop");
    setState("thinking", "분석 중…");

    const history = state.turns.slice(-HISTORY_LIMIT).map(({ role, content }) => ({ role, content }));
    let firstText = true;
    try {
      const { text: answer, truncated } = await sample([{ role: "user", content: rules() }, ...history], {
        cache: false,
        signal: ctl.signal,
        onText: ({ text }) => {
          if (firstText) { firstText = false; setState("speaking", "응답 중"); }
          reply.body.innerHTML = renderReply(text);
          scrollDown();
        },
      });
      reply.body.innerHTML = renderReply(answer);
      if (truncated) {
        const n = document.createElement("div"); n.className = "note";
        n.textContent = "답변이 길어 중간에 잘렸습니다. '계속'이라고 말씀하시면 이어서 답합니다.";
        reply.el.append(n);
      }
      state.turns.push({ role: "assistant", content: answer, t: Date.now() });
      save();
      speak(answer);
    } catch (e) {
      const partial = (e && e.text) || "";
      if (partial) {
        reply.body.innerHTML = renderReply(partial);
        state.turns.push({ role: "assistant", content: partial, t: Date.now() });
        save();
      } else {
        reply.body.textContent = e && e.code === "cancelled" ? "(중지됨)" : "";
      }
      if (!e || e.code !== "cancelled") {
        const n = document.createElement("div"); n.className = "err";
        n.textContent = errCopy(e && e.code);
        reply.el.append(n);
      }
      if (e && e.code === "not_granted") { goOffline("오프라인 · 권한 없음"); }
    } finally {
      busy = false; ctl = null;
      sendBtn.textContent = "전송"; sendBtn.classList.remove("stop");
      if (app.dataset.state !== "offline" && !(canSpeak && state.voice && speechSynthesis.speaking)) setState("idle", "온라인 · 대기 중");
      scrollDown();
      if (!box.disabled) box.focus();
    }
  }

  function goOffline(label) {
    sample = null;
    setState("offline", label);
    box.disabled = true; sendBtn.disabled = true;
  }

  // ---------- input ----------
  function autosize() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; }
  box.addEventListener("input", autosize);
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (!busy) send(box.value);
    }
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) { ctl && ctl.abort(); return; }
    send(box.value);
  });
  $("newChat").onclick = () => {
    if (busy && ctl) ctl.abort();
    try { speechSynthesis.cancel(); } catch (e) {}
    state = fresh(); save(); renderAll();
    if (sample) setState("idle", "온라인 · 대기 중");
    box.focus();
  };

  // ---------- boot ----------
  syncVoiceBtn();
  renderAll();
  box.disabled = true; sendBtn.disabled = true;
  (async () => {
    try { sample = window.claude ? await window.claude.use("sample") : null; } catch (e) { sample = null; }
    if (!sample) {
      goOffline("오프라인");
      const n = document.createElement("div"); n.className = "msg jarvis";
      n.innerHTML = '<div class="err">이 화면에서는 Claude에 연결할 수 없습니다. claude.ai에서 이 페이지를 열어 주세요.</div>';
      log.append(n);
      return;
    }
    box.disabled = false; sendBtn.disabled = false;
    setState("idle", "온라인 · 대기 중");
    box.focus();
  })();
})();
</script>
